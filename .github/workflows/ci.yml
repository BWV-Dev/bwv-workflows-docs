name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run content guard
        run: pnpm content-guard
        env:
          CONTENT_DENYLIST: ${{ secrets.CONTENT_DENYLIST }}
      - name: Test content guard
        run: pnpm test:content-guard
      - name: Typecheck
        run: pnpm typecheck
      - name: Build the site
        run: pnpm build
